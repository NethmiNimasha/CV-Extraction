<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CV Profile Extractor and Population Service">
    <title>Auto Populate Candidate Profile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <main class="container">
        <header>
            <h1>Candidate Profile Populator</h1>
            <p>Upload a CV and we'll intelligently extract the data.</p>
        </header>

        <section class="upload-section glass-panel">
            <div class="upload-area" id="drop-zone">
                <input type="file" id="cv-upload" accept=".pdf,.docx" hidden>
                <div class="upload-content">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="17 8 12 3 7 8"></polyline>
                        <line x1="12" y1="3" x2="12" y2="15"></line>
                    </svg>
                    <h3>Drag & Drop CV or Click to Browse</h3>
                    <p>Supports PDF and DOCX (Max 5MB)</p>
                </div>
                <button class="btn-primary" onclick="document.getElementById('cv-upload').click()">Browse Files</button>
            </div>
            <div id="upload-status" class="status-message"></div>
        </section>

        <section class="profile-section glass-panel hidden" id="profile-container">
            <h2>Extracted Candidate Profile</h2>
            <form id="profile-form">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" placeholder="John Doe">
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="john@example.com">
                </div>
                
                <div class="form-group">
                    <label for="skills">Skills</label>
                    <div class="tags-container" id="skills-container"></div>
                    <input type="hidden" id="skills" name="skills">
                </div>

                <div class="form-group">
                    <label for="education">Education</label>
                    <textarea id="education" name="education" rows="3" placeholder="Bachelor of Science..."></textarea>
                </div>

                <div class="form-group">
                    <label for="experience">Experience</label>
                    <textarea id="experience" name="experience" rows="4" placeholder="Software Engineer..."></textarea>
                </div>

                <div class="actions">
                    <button type="button" class="btn-secondary" id="btn-cancel">Cancel</button>
                    <button type="submit" class="btn-primary glow-effect">Apply to Profile</button>
                </div>
            </form>
            <div id="save-status" class="status-message"></div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
